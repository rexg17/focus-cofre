name: Executável único (PyInstaller)
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --onefile --windowed --name FocusCofre --icon web/icon.ico --collect-submodules anthropic --add-data "web;web" app.py
      - uses: actions/upload-artifact@v4
        with: {name: FocusCofre-exe, path: dist/FocusCofre.exe}
